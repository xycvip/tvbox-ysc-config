name: Offline TVBox Decrypt Test

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "可选：待测试接口/图片 URL（只下载原始数据，解密在 Actions 本地完成）"
        required: false
        type: string
      payload:
        description: "可选：直接粘贴待解密内容；与 source_url 二选一"
        required: false
        type: string
      algorithm:
        description: "解密方式；auto 不猜测密钥或 AES 参数"
        required: true
        type: choice
        options:
          - auto
          - base64
          - tvbox-marked-cbc
          - aes-ecb-tvbox
          - aes-cbc-tvbox
          - aes-ecb-cryptox
          - aes-cbc-cryptox
          - rsa
        default: auto
      input_format:
        description: "Crypto.aes 输入格式"
        required: true
        type: choice
        options:
          - auto
          - base64
          - hex
          - text
        default: auto
      aes_key:
        description: "AES 测试密钥（仅测试用；不要粘贴生产密钥）"
        required: false
        type: string
      aes_iv:
        description: "AES-CBC IV"
        required: false
        type: string
      rsa_key:
        description: "RSA 测试密钥 PEM 或 Base64 DER（不要粘贴生产私钥）"
        required: false
        type: string
      rsa_key_type:
        description: "RSA 解密密钥类型"
        required: true
        type: choice
        options:
          - private
          - public
        default: private
      rsa_long:
        description: "是否按模数长度分块解密"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline-decrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install local crypto implementation
        run: python -m pip install --disable-pip-version-check pycryptodome==3.23.0

      - name: Validate TVBoxOS-compatible crypto routines
        run: |
          python -m py_compile scripts/decrypt_test.py
          python - <<'PY'
          import importlib.util
          from Crypto.Cipher import AES, PKCS1_v1_5
          from Crypto.PublicKey import RSA
          from Crypto.Util.Padding import pad

          spec = importlib.util.spec_from_file_location("decrypt_test", "scripts/decrypt_test.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          # Internationalized domain names are normalized before urllib receives the URL.
          assert mod.normalize_source_url("http://www.饭太硬.net/tv") == "http://www.xn--sss604efuw.net/tv"
          assert mod.normalize_source_url("https://例子.测试/路径?q=中文") == "https://xn--fsqu00a.xn--0zwm56d/%E8%B7%AF%E5%BE%84?q=%E4%B8%AD%E6%96%87"

          message = b'{"sites":[{"key":"offline-test"}]}'
          # TVBox feeds may contain JSONC comments and trailing commas.
          jsonc = b'{\n  // comment\n  "url":"https://example.com/a//b",\n  "sites":[{"key":"offline-test",}],\n}'
          parsed_jsonc = mod.try_json(jsonc)
          assert parsed_jsonc and parsed_jsonc["url"] == "https://example.com/a//b"
          assert mod.is_tvbox_json(parsed_jsonc)
          key = "0123456789abcdef"
          iv = "abcdef0123456789"

          ecb = AES.new(key.encode(), AES.MODE_ECB).encrypt(pad(message, 16))
          assert mod.aes_decrypt(ecb, key, "", "ECB", "tvbox") == message

          cbc = AES.new(key.encode(), AES.MODE_CBC, iv.encode()).encrypt(pad(message, 16))
          assert mod.aes_decrypt(cbc, key, iv, "CBC", "tvbox") == message

          short_key, short_iv = "short-key", "short-iv"
          padded_key = short_key.encode().ljust(16, b"\0")
          padded_iv = short_iv.encode().ljust(16, b"\0")
          cbc_x = AES.new(padded_key, AES.MODE_CBC, padded_iv).encrypt(pad(message, 16))
          assert mod.aes_decrypt(cbc_x, short_key, short_iv, "CBC", "cryptox") == message

          rsa = RSA.generate(1024)
          long_message = b"TVBoxOS RSA segmented decrypt self-test " * 8
          enc = PKCS1_v1_5.new(rsa.publickey())
          rsa_cipher = b"".join(enc.encrypt(long_message[i:i+117]) for i in range(0, len(long_message), 117))
          assert mod.rsa_decrypt(rsa_cipher, rsa.export_key().decode(), "private", True) == long_message

          # TVBoxOS also permits public-key decrypt of a PKCS#1 v1.5 type-1 block.
          size = rsa.size_in_bytes()
          em = b"\x00\x01" + b"\xff" * (size - len(message) - 3) + b"\x00" + message
          signed_block = pow(int.from_bytes(em, "big"), rsa.d, rsa.n).to_bytes(size, "big")
          assert mod.rsa_decrypt(signed_block, rsa.publickey().export_key().decode(), "public", False) == message

          # Reproduce ApiConfig.FindResult(): HEX("$#" + 13 digits + "#$" + AES-CBC + 13-digit IV)
          marker_digits = "1234567890123"
          marker_key = marker_digits.ljust(16, "0").encode()
          marker_iv = marker_digits.ljust(16, "0").encode()
          marker_cipher = AES.new(marker_key, AES.MODE_CBC, marker_iv).encrypt(pad(message, 16))
          marker_payload = (b"$#" + marker_digits.encode() + b"#$" + marker_cipher + marker_digits.encode()).hex().encode()
          assert mod.decrypt_tvbox_marked_hex(marker_payload) == message

          # Binary image input must pass through to the image-wrapper detector.
          assert mod.decrypt_tvbox_marked_hex(b"\\xff\\xd8\\xff\\xd9**") is None

          print("SELF_TEST_OK: JSONC, AES ECB/CBC, Crypto.aes padding, RSA private segmented + public decrypt, TVBoxOS marked HEX/AES-CBC")
          PY

      - name: Check every link in config JSON files
        run: |
          python -m py_compile scripts/check_config_links.py
          python scripts/check_config_links.py

      - name: Run offline decrypt test
        if: ${{ inputs.source_url != '' || inputs.payload != '' }}
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          PAYLOAD: ${{ inputs.payload }}
          ALGORITHM: ${{ inputs.algorithm }}
          INPUT_FORMAT: ${{ inputs.input_format }}
          AES_KEY: ${{ inputs.aes_key }}
          AES_IV: ${{ inputs.aes_iv }}
          RSA_KEY: ${{ inputs.rsa_key }}
          RSA_KEY_TYPE: ${{ inputs.rsa_key_type }}
          RSA_LONG: ${{ inputs.rsa_long }}
        shell: bash
        run: |
          args=(--algorithm "$ALGORITHM" --input-format "$INPUT_FORMAT" --output decrypt-output)
          if [[ -n "$SOURCE_URL" ]]; then
            args+=(--url "$SOURCE_URL")
          elif [[ -n "$PAYLOAD" ]]; then
            args+=(--payload "$PAYLOAD")
          fi
          if [[ "$RSA_LONG" == "true" ]]; then
            args+=(--rsa-long)
          fi
          python scripts/decrypt_test.py "${args[@]}"

      - name: Upload decrypt result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-decrypt-result
          path: |
            decrypt-output/
            link-check-output/
          if-no-files-found: ignore
          retention-days: 3
