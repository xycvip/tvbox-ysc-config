name: 备用网址同步

"on":
  workflow_dispatch:
  schedule:
    - cron: "25 5,17 * * *"

permissions:
  contents: write

concurrency:
  group: sync-backup-api-urls
  cancel-in-progress: false

jobs:
  sync:
    name: 同步备用网址
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 检查脚本语法并同步备用网址
        run: |
          if python -m py_compile .github/scripts/sync_backup_list.py; then
            echo "::notice::脚本语法检查通过"
            if python .github/scripts/sync_backup_list.py; then
              echo "::notice::备用网址同步脚本执行完成"
            else
              echo "::warning::备用网址同步执行异常，已跳过本次更新；工作流继续"
            fi
          else
            echo "::warning::脚本语法检查未通过，已跳过本次更新；工作流继续"
          fi

      - name: 提交配置变更
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sources.json
          if git diff --cached --quiet; then
            echo "::notice::没有新增可用备用网址，跳过提交"
          else
            git commit -m "chore: 同步备用网址"
            git push origin main
          fi
